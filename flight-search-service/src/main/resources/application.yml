spring:
  application:
    name: flight-search-service
  profiles:
    active: local

---
# Local development / demo profile: in-memory H2 DB, no Redis required.
# Run with: mvn spring-boot:run  (defaults to this profile)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:flightdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  cache:
    type: simple   # in-memory ConcurrentHashMap cache, no Redis needed locally

---
# Production profile: MySQL + Redis, used when deployed.
# Activate with: SPRING_PROFILES_ACTIVE=prod
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flightdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis

management:
  endpoints:
    web:
      exposure:
        include: health,info
